<?xml version="1.0" encoding="UTF-8"?>
<!-- DREAMGRID SENTINEL MAP DIRECTION ARROW V1 -->
<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 64 64">

    <defs>

        <linearGradient
            id="arrowFill"
            x1="0"
            y1="0"
            x2="0"
            y2="1">

            <stop
                offset="0"
                stop-color="#ffffff"/>

            <stop
                offset="0.55"
                stop-color="#f3f3ed"/>

            <stop
                offset="1"
                stop-color="#cfd2cf"/>

        </linearGradient>

        <filter
            id="shadow"
            x="-25%"
            y="-25%"
            width="150%"
            height="150%">

            <feDropShadow
                dx="0"
                dy="2"
                stdDeviation="1.5"
                flood-color="#002f4d"
                flood-opacity="0.85"/>

        </filter>

    </defs>

    <path
        d="
            M32 7
            L53 28
            L42 28
            L42 56
            L22 56
            L22 28
            L11 28
            Z
        "
        fill="url(#arrowFill)"
        stroke="#ffffff"
        stroke-width="2"
        stroke-linejoin="round"
        filter="url(#shadow)"/>

</svg>